[package]
name = "override"
version = "0.1.0"
edition = "2024"

[lib]
name = "override"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "override"
path = "src/main.rs"

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
boa_engine = { version = "0.21.1", features = ["jsvalue-enum"] }
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"

[profile.release]
# This compiler spends its time parsing and rewriting large YAML trees. Optimize for startup
# throughput rather than APK footprint; packaging can compress the resulting shared object.
opt-level = 3
lto = "fat"
panic = "abort"
codegen-units = 1
debug = false
incremental = false
overflow-checks = false
debug-assertions = false
