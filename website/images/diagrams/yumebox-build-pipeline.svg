<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 937.3503333333335 895.2" width="937.3503333333335" height="895.2" style="--bg:#FFFFFF;--fg:#27272A;--line:#A1A1AA;--accent:#3F3F46;--muted:#71717A;--surface:#F4F4F5;--border:#D4D4D8;--_line:#A1A1AA;--_arrow:#A1A1AA;--_text:#27272A;--_text-sec:#71717A;--_text-muted:#71717A;--_node-fill:#FFFFFF;--_node-stroke:#71717A;--_group-fill:#3F3F4618;--_group-hdr:#3F3F46;--_inner-stroke:#71717A" id="bm-diagram-1">
<style>
#bm-diagram-1 {
  /* 覆盖 CSS 变量 */
  --_text:       #27272A       !important;
  --_text-sec:   #71717A !important;
  --_line:       #A1A1AA      !important;
  --_arrow:      #A1A1AA      !important;
  --_node-fill:  #FFFFFF       !important;
  --_node-stroke:#71717A    !important;
  --_group-fill: #3F3F4618 !important;
  --_group-hdr:  #3F3F46 !important;
}
#bm-diagram-1 text {
  font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace !important;
  font-size:   13px !important;
  dominant-baseline: central;
  dy: 0.35em;
}
/* ── 类图/ER图标题文字：覆盖内联 dy，实现真正的垂直居中 ── */
/* 类图类名、ER图实体名使用 renderMultilineText 渲染，内联 dy 与 font-size 相关，
   但某些字体下 central 基线对中文不准确，改用 middle + 动态 dy 计算 */
#bm-diagram-1 .class-node text,
#bm-diagram-1 .entity text {
  dy: 0.35em !important;
}
/* 类图/ER图标题使用 middle 基线，对中文字体更友好 */
#bm-diagram-1 .class-node > text:first-of-type,
#bm-diagram-1 .class-node text[text-anchor="middle"],
#bm-diagram-1 .entity > text:first-of-type,
#bm-diagram-1 .entity text[text-anchor="middle"] {
  dominant-baseline: middle !important;
}
/* ── 节点形状：类选择器 + 通用元素选择器双保险，确保无论 cleanHardcodedColors 是否删除 fill 属性都能生效 ── */
/* 排除 .block 内的矩形（时序图 loop/alt/opt/rect 块），避免覆盖其专属样式 */
#bm-diagram-1 .node rect,
#bm-diagram-1 .node circle,
#bm-diagram-1 .node ellipse,
#bm-diagram-1 .node polygon,
#bm-diagram-1 .node path,
#bm-diagram-1 rect,
#bm-diagram-1 circle,
#bm-diagram-1 ellipse {
  fill:         #FFFFFF        !important;
  stroke:       #71717A     !important;
  stroke-width: 2px !important;
  filter: drop-shadow(0 0px 0px transparent) !important;
}
/* ── 时序图 block（loop/alt/opt）矩形：覆盖通用 rect 规则 ── */
/* 外边框矩形（block 内第一个 rect）：fill none，只有描边 */
#bm-diagram-1 .block > rect:first-of-type {
  fill:         none !important;
  stroke:       #71717A !important;
  stroke-width: 1px !important;
  filter:       none !important;
}
/* header tab 矩形（block 内第二个 rect，即 rect + rect）：accent 半透明填充 */
#bm-diagram-1 .block > rect:nth-of-type(2) {
  fill:         #3F3F4630 !important;
  stroke:       #71717A !important;
  stroke-width: 1px !important;
  filter:       none !important;
}
/* 时序图 block（loop/alt/opt）文字：10px */
#bm-diagram-1 .block text {
  font-size: 10px !important;
}
/* seq-rect-bg：rect rgb(...) 纯背景色块，不加描边，不加阴影 */
#bm-diagram-1 .seq-rect-bg {
  stroke:       none !important;
  stroke-width: 0 !important;
  filter:       none !important;
}
#bm-diagram-1 .node rect {
  rx: 4px !important;
  ry: 4px !important;
}
/* 菱形/多边形节点 */
#bm-diagram-1 .node polygon {
  fill:   #FFFFFF     !important;
  stroke: #71717A  !important;
  stroke-width: 2px !important;
}
/* 节点文字 */
#bm-diagram-1 g.node text,
#bm-diagram-1 .label text,
#bm-diagram-1 .nodeLabel {
  fill: #27272A !important;
}
/* 子图/cluster 标题 */
#bm-diagram-1 .cluster-label text {
  fill:        #3F3F46 !important;
  font-size:   12px !important;
  font-weight: 600 !important;
}
/* cluster 容器 */
#bm-diagram-1 .cluster rect {
  fill:   #3F3F4618 !important;
  stroke: #71717A !important;
  stroke-width: 1px !important;
  filter: none !important;
}
/* 边/连线：只选连线相关路径，不影响节点内部形状 */
#bm-diagram-1 .edge path,
#bm-diagram-1 .edgePath path,
#bm-diagram-1 .edgePath .path {
  fill:         none          !important;
  stroke:       #A1A1AA  !important;
  stroke-width: 2px !important;
}
/* 连线（line 元素） */
#bm-diagram-1 .edge line,
#bm-diagram-1 .flowchart-link {
  stroke:       #A1A1AA  !important;
  stroke-width: 2px !important;
}
/* 箭头：marker 内的多边形/路径专属 */
#bm-diagram-1 marker polygon,
#bm-diagram-1 marker path,
#bm-diagram-1 .arrowhead polygon,
#bm-diagram-1 .arrowhead path {
  stroke: #A1A1AA !important;
  fill:   #A1A1AA !important;
  filter: none !important;
}
/* 边标签 */
#bm-diagram-1 .edgeLabel text,
#bm-diagram-1 .edgeLabel {
  fill:      #71717A !important;
  font-size: 11px  !important;
}
/* ── Semantic Role Colors ── */
#bm-diagram-1 .bm-critical.node rect,
#bm-diagram-1 .bm-critical.node circle,
#bm-diagram-1 .bm-critical.node ellipse,
#bm-diagram-1 .bm-critical.node polygon {
  fill:   #FFF7ED   !important;
  stroke: #F97316 !important;
  stroke-width: 2px   !important;
}
#bm-diagram-1 .bm-critical.node text {
  fill: #9A3412 !important;
}
#bm-diagram-1 .bm-success.node rect,
#bm-diagram-1 .bm-success.node circle,
#bm-diagram-1 .bm-success.node ellipse,
#bm-diagram-1 .bm-success.node polygon {
  fill:   #F0FDF4   !important;
  stroke: #22C55E !important;
  stroke-width: 2px   !important;
}
#bm-diagram-1 .bm-success.node text {
  fill: #166534 !important;
}
#bm-diagram-1 .bm-danger.node rect,
#bm-diagram-1 .bm-danger.node circle,
#bm-diagram-1 .bm-danger.node ellipse,
#bm-diagram-1 .bm-danger.node polygon {
  fill:   #FEF2F2   !important;
  stroke: #EF4444 !important;
  stroke-width: 2px   !important;
}
#bm-diagram-1 .bm-danger.node text {
  fill: #991B1B !important;
}
#bm-diagram-1 .bm-info.node rect,
#bm-diagram-1 .bm-info.node circle,
#bm-diagram-1 .bm-info.node ellipse,
#bm-diagram-1 .bm-info.node polygon {
  fill:   #EFF6FF   !important;
  stroke: #3B82F6 !important;
  stroke-width: 2px   !important;
}
#bm-diagram-1 .bm-info.node text {
  fill: #1D4ED8 !important;
}
#bm-diagram-1 .bm-muted.node rect,
#bm-diagram-1 .bm-muted.node circle,
#bm-diagram-1 .bm-muted.node ellipse,
#bm-diagram-1 .bm-muted.node polygon {
  fill:   #F4F4F5   !important;
  stroke: #A1A1AA !important;
  stroke-width: 2px   !important;
}
#bm-diagram-1 .bm-muted.node text {
  fill: #52525B !important;
}</style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
